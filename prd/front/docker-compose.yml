services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:2885681df6e89e63a5cfe1641293d3a54c41c8d9-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
