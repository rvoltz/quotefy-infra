services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:8c13b7ae550876437e9583f1e4a2397aa9b68fc4-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
