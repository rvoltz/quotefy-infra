services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:a6488812240c834d687d10b4a41ddfb82465d506-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
