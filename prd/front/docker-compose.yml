services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:475507129cf4cb50734e9d558503639ef888d51a-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
