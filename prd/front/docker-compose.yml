services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:43ad949d2c4533fe21199f534630cbbfbff0d063-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
