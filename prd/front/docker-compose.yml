services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:2167851e280e39de1964c282e08f85bc10a8d55b-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
