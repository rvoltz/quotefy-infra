services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:e974b12b041d02b7da067976e80d109f90f0506d-prd
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62081
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-prd_quotefy-net

networks:
  quotefy-back-prd_quotefy-net:
    external: true
