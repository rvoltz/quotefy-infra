version: "3.8"

services:
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - quotefy-net
    deploy:
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    volumes:
      # No Portainer com Git, o caminho relativo funciona se a stack for lida do repositório
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - quotefy-net
    deploy:
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 63001 # Acesso ao Grafana pelo seu IP:63001
        protocol: tcp
        mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - quotefy-net
    deploy:
      restart_policy:
        condition: on-failure

networks:
  quotefy-net:
    external: true # Isso avisa ao Swarm para usar a rede que o back-end já criou

volumes:
  prometheus-data:
  grafana-data: