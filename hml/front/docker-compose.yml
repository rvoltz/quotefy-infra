services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:934fac57144c73307a427388828645a74957e75a
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
