services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:b79da7025786c4f87d4004e2c86401d1415716b4
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
