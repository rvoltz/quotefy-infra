services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:94362514d233062f5a7da7ddaea7d0fe4e977ef1
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
