services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:ef038f1e88380ea68166e304401203ffaaa91812
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
