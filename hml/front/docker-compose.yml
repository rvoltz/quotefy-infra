services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:366c146be1e64c1ceb0689183a8acf2daa7b01e7
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
