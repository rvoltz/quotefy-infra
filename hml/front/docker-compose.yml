services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:bca9e6ac9fc3b8eab4d59277dc36b671aa307641
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
