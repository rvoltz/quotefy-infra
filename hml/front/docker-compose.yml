services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:1c0217bf16a9c84f35ea1fc55828e6df7dfd87e8
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
