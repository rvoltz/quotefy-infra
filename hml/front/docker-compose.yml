services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:006e3d0bf4f9c499dd27f3d25e0d1ed3090386ba
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
