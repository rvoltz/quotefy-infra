services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:f16f4363d10de8631dd7f8be369e75ad87a5d6d3
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
