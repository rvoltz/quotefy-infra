services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:8fbcf2f76cec317df74e4a0e0a034ca6157604a2
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
