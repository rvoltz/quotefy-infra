services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:cfa99e644377d0541ad47aaf40b0dd9c18b7704e
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
