services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:66ca606047cb7957f24d7d8f053a489e8e6d4393
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
