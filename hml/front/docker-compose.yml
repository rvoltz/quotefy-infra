services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:4f321ff3fea23f7d3132cf820431b38b4d3916b7
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
