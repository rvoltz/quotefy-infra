services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:446b352b1f2c5f9369e04ae61ffa8abec8b8ed08
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
