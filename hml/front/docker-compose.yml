services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:e1774204f0ba8f0343d43dae6a901943110fde5c
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
