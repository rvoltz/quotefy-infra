services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:0ccaeae54ba126666675561f0de690d24fe9e3e9
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
