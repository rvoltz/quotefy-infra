services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:af1934d92cf3b9b84e96b70c962d2712a5a7b017
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
