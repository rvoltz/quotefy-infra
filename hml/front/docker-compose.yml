services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:916c49f3c2c4f47d13ea24c0c83c4774baa288c8
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
