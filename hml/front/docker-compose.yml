services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:4e6818272de1f197dae8ef7223d0296a893aa515
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
