services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:372c6a0fdc95b6d83a2898d584273975eeae4f74
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
