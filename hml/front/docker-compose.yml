services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:9142c87ce282ebe02019056567ad2212feb9def9
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
