services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:8db6bf100fe3d83323f6dae82d57242995cc0f6f
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
