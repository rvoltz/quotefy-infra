services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:1115c05b0bbfa73a242ef78185abbc10714e3cb9
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
