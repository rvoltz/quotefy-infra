services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:ba1bf919d2ea2309b8216a8af51c155918ab6428
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
