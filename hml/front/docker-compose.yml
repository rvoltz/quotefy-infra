services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:53b6feb8cd18de75069aa39ce5df3748a2c2160e
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
