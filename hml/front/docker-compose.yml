services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:f04f7c6860d91fe0d48f656438ccf039a9314e51
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
