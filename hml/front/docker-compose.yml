services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:200c0a5c16ca17272b44ab39a410bcac77cd602e
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
