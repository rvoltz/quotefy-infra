services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:7d755070a08943dcf6214d2f5e92771c339cbbc9
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
