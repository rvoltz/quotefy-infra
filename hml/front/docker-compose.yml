services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:9da98ff2d20b29bf32997286a11e9e099ca58163
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
