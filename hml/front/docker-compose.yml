services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:0010e6ec8077dc5e0944feb294e57f869f1e9fcb
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
