services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:52e6365ca55bfd8a008ae6504da86faf74a5b5ba
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
