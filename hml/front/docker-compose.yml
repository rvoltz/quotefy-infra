services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:03429ebd9e6bb005fb88d5f3a37d81fc83ca4d5c
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
