services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:b24cef560c8386bec5d554c3c80d2998817c963b
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
