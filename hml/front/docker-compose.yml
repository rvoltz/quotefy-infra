services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:912df0b086636cd40f44edb1eddc0c5950b01b0d
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
