services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:90024ca0842bf29cff56e7f2e385b1c748c59474
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
