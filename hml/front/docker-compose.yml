services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:af9fb2ec5989d35fec71361215885c8a8156ab6e
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
