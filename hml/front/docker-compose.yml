services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:41939e59e8cee38da872948346d653ec4fe4e8c4
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
