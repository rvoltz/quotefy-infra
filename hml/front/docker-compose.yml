services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:db121c673fdfec36262d623543c7f4d66c8c0505
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
