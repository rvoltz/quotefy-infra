services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:e974b12b041d02b7da067976e80d109f90f0506d
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
