services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:340ee0d82b294a5ed71667c2bbe4727dffffdf74
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
