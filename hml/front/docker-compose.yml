services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:34c824aa744216cafb10c03d0f028186375d20d3
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
