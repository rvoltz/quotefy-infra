services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:1d5f5085d55d9a766a1c39b87c829f6f631364b8
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
