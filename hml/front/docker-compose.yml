services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:a8197d23c136451744e4caee97f950ea637c3343
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
