services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:3464b01ae821c39466c315051ec3fd5848a55285
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
