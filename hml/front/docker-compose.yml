services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:0d762d6bec2af98ba915766901955c58bd415d55
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
