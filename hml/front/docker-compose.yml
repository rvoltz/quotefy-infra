services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:abca7aa22894fdf6e15bf29fe6b6311c7ba07571
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
