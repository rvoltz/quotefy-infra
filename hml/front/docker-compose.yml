services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:668ab9b41a5b1f8c0251c552fb244bb44764b803
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
