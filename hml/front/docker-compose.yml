services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:b74fbb0f9ad50cc525d0abfe39bde41882db024b
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
