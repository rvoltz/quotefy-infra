services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:65c9365683a95d0e40f30b6f437d910ef24b2e35
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
