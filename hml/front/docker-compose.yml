services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:7fb5760d40fd87a74b6bf477b9ca6bac768dd7b7
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
