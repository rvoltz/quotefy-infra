services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:0e03e550fc089e462eaaf7e683dccb4c9b563647
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
