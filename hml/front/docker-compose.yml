services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:f37c9f1e5d4e8872910d9ed511be8c2d8abc1651
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
