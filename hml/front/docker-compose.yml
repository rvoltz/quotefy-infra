services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:54e4c352f55041a93046a73fa36d1febb7ef210a
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
