services:
  frontend:
    image: ghcr.io/rvoltz/quotefy-front-app:d05e8dc9e27c3456a1ab2f5bbfc40bdccb882680
    env_file: [front.env]
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 62080
        protocol: tcp
        mode: host
    networks:
      - quotefy-back-hml_quotefy-net

networks:
  quotefy-back-hml_quotefy-net:
    external: true
